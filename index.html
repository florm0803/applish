let progress=JSON.parse(localStorage.getItem('applishProgress')||'{}');let quizScore=0;let category='Todas',subcategory='Todas',onlyFav=false,quizIndex=0,quizItems=[];const $=id=>document.getElementById(id);let fav=new Set(JSON.parse(localStorage.getItem('applishFavorites')||'[]'));const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

[4])}</p><div class="example">“${escapeHTML(x[5])}”<small>${escapeHTML(x[6])}</small></div><div class="meta"><span>${escapeHTML(x[1])} · ${x[7]}</span><button class="heart" data-fav="${escapeHTML(x[2])}" aria-label="Favorito">${fav.has(x[2])?'♥':'♡'}</button></div></article>`;$('cards').innerHTML=(onlyFav&&category==='Todas'&&subcategory==='Todas'? [...new Set(filtered.map(x=>x[0]))].map(c=>`<div class="fav-group"><h3>${escapeHTML(categoryLabels[c]||c)}</h3>${[...new Set(filtered.filter(x=>x[0]===c).map(x=>x[1]))].map(sub=>`<div class="fav-subgroup"><h4>${escapeHTML(sub)}</h4><div class="cards">${filtered.filter(x=>x[0]===c&&x[1]===sub).map(cardHTML).join('')}</div></div>`).join('')}</div>`).join(''):filtered.map(cardHTML).join(''))||'<p>No hay resultados. Probá otro filtro.</p>';document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{fav.has(b.dataset.fav)?fav.delete(b.dataset.fav):fav.add(b.dataset.fav);localStorage.setItem('applishFavorites',JSON.stringify([...fav]));render()})}

function startQuiz(){quizItems=[...data].sort(()=>Math.random()-.5).slice(0,10);quizIndex=0;quizScore=0;showQuiz()}

let x=quizItems[quizIndex];let distractors=data.filter(y=>y[2]!==x[2]).sort(()=>Math.random()-.5).slice(0,3).map(y=>y[3]);let options=[x[3],...distractors].sort(()=>Math.random()-.5);

p.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let right=b.dataset.answer===x[3];if(right)quizScore++;let entry=progress[x[2]]||{correct:0,wrong:0};entry[right?'correct':'wrong']++;progress[x[2]]=entry;localStorage.setItem('applishProgress',JSON.stringify(progress));p.querySelectorAll('[data-answer]').forEach(z=>z.disabled=true);$('quizFeedback').innerHTML=`<p class="${right?'good':'bad'}"><strong>${right?'¡Correcto!':'Todavía no.'}</strong> ${escapeHTML(x[2])} = ${escapeHTML(x[3])}</p><p>${escapeHTML(x[4])}</p><p><em>${escapeHTML(x[5])}</em><br>${escapeHTML(x[6])}</p><button id="next">${quizIndex===9?'Ver resultado':'Siguiente →'}</button>`;$('next').onclick=()=>{quizIndex++;showQuiz()};render()})}
