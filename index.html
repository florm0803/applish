let category='Todas',subcategory='Todas',onlyFav=false,quizIndex=0,quizItems=[];const $=id=>document.getElementById(id);let fav=new Set(JSON.parse(localStorage.getItem('atlasFavorites')||'[]'));const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){let cats=['Todas',...new Set(data.map(x=>x[0]))];$('categories').innerHTML=cats.map(c=>`<button class="${category===c?'active':''}" data-cat="${escapeHTML(c)}">${escapeHTML(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;subcategory='Todas';render()});let subs=['Todas',...new Set(data.filter(x=>category==='Todas'||x[0]===category).map(x=>x[1]))];$('subcategories').innerHTML=subs.map(s=>`<button class="${subcategory===s?'active':''}" data-sub="${escapeHTML(s)}">${escapeHTML(s)}</button>`).join('');document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{subcategory=b.dataset.sub;render()});let q=$('search').value.toLocaleLowerCase(),lev=$('level').value;let filtered=data.filter(x=>(category==='Todas'||x[0]===category)&&(subcategory==='Todas'||x[1]===subcategory)&&(!lev||x[7]===lev)&&(!onlyFav||fav.has(x[2]))&&x.some(t=>t.toLocaleLowerCase().includes(q)));$('heading').textContent=category==='Todas'?'Explorá tu vocabulario':category;$('counter').textContent=`${filtered.length} entradas · ${data.length} en total`;$('cards').innerHTML=filtered.map(x=>`<article class="card"><h3>${escapeHTML(x[2])}</h3><div class="translation">${escapeHTML(x[3])}</div><p class="meaning">${escapeHTML(x[4])}</p><div class="example">“${escapeHTML(x[5])}”<small>${escapeHTML(x[6])}</small></div><div class="meta"><span>${escapeHTML(x[1])} · ${x[7]}</span><button class="heart" data-fav="${escapeHTML(x[2])}" aria-label="Favorito">${fav.has(x[2])?'♥':'♡'}</button></div></article>`).join('')||'<p>No hay resultados. Probá otro filtro.</p>';document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{fav.has(b.dataset.fav)?fav.delete(b.dataset.fav):fav.add(b.dataset.fav);localStorage.setItem('atlasFavorites',JSON.stringify([...fav]));render()})}
$('search').oninput=render;$('level').onchange=render;$('favorites').onclick=()=>{onlyFav=!onlyFav;$('favorites').classList.toggle('active',onlyFav);render()};$('practiceBtn').onclick=()=>{let p=$('practice');p.classList.toggle('hidden');if(!p.classList.contains('hidden')){quizItems=[...data].sort(()=>Math.random()-.5).slice(0,10);quizIndex=0;showQuiz()}};function showQuiz(){let p=$('practice');if(quizIndex>=quizItems.length){p.innerHTML='<h2>¡Terminaste la ronda! 🎉</h2><button id="restart">Otra ronda</button>';$('restart').onclick=()=>$('practiceBtn').click();return}let x=quizItems[quizIndex];p.innerHTML=`<h2>Práctica ${quizIndex+1}/10</h2><p>¿Qué significa <strong>${escapeHTML(x[2])}</strong>?</p><button id="reveal">Mostrar respuesta</button><div id="answer" class="hidden"><p><strong>${escapeHTML(x[3])}</strong> — ${escapeHTML(x[4])}</p><p><em>${escapeHTML(x[5])}</em></p><button id="next">Siguiente →</button></div>`;$('reveal').onclick=()=>{$('answer').classList.remove('hidden');$('reveal').classList.add('hidden');$('next').onclick=()=>{quizIndex++;showQuiz()}}}render();
